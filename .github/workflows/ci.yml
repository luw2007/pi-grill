name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dev dependencies
        run: bun install
      - name: Install pi peer dependencies
        run: bun add --no-save @earendil-works/pi-coding-agent @earendil-works/pi-tui typebox
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun test
